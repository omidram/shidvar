plugins {
    id "com.android.application"
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "com.shidro.app"
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "role"
    productFlavors {
        driver {
            dimension "role"
            applicationId "com.shidro.driver"
            resValue "string", "app_name", "شیدرو راننده"
            buildConfigField "String", "START_URL", "\"https://shidro.com/login?portal=DRIVER\""
        }
        owner {
            dimension "role"
            applicationId "com.shidro.owner"
            resValue "string", "app_name", "شیدرو صاحب بار"
            buildConfigField "String", "START_URL", "\"https://shidro.com/login?portal=REQUESTER\""
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
}
